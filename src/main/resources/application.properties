# MongoDB - configure via variaveis de ambiente (nunca commite credenciais):
# MONGODB_URI=mongodb+srv://user:pass@cluster0.xxx.mongodb.net/?appName=Cluster0
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/pizzaria}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}

# Admin inicial (troque via env em producao)
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:teste123}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

server.forward-headers-strategy=framework
