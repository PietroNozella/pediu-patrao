<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a href="/pedidos/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger" id="erroStatus" style="display:none;" role="alert"></div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente</th>
                        <th>Itens</th>
                        <th>Subtotal</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Responsável</th>
                        <th>Entrada</th>
                        <th>Responsável saída</th>
                        <th>Saída</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="12" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <ul class="list-unstyled mb-0 small" th:if="${!#lists.isEmpty(pedido.itens)}">
                                <li th:each="item : ${pedido.itens}"
                                    th:text="${item.quantidade} + 'x ' + ${item.nomeProduto}"></li>
                            </ul>
                            <span class="small text-muted"
                                  th:if="${#lists.isEmpty(pedido.itens)}"
                                  th:text="${(pedido.tipoPizza ?: '') + ' ' + (pedido.sabor ?: '') + ' (' + pedido.quantidade + ')'}"></span>
                        </td>
                        <td th:text="${pedido.valorSubtotal != null} ? 'R$ ' + ${#numbers.formatDecimal(pedido.valorSubtotal, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td th:text="${pedido.valorDesconto != null} ? 'R$ ' + ${#numbers.formatDecimal(pedido.valorDesconto, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td class="fw-medium" th:text="${pedido.valorTotal != null} ? 'R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')} : '—'"></td>
                        <td th:text="${pedido.responsavelRegistro ?: '—'}"></td>
                        <td class="small" th:text="${pedido.dataHoraEntrada != null} ? ${#temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                        <td th:text="${pedido.responsavelSaida ?: '—'}"></td>
                        <td class="small" th:text="${pedido.dataHoraSaida != null} ? ${#temporals.format(pedido.dataHoraSaida, 'dd/MM/yyyy HH:mm')} : '—'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO' or pedido.status == 'PRONTO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${#strings.replace(pedido.status, '_', ' ')}">
                            </span>
                        </td>
                        <td class="text-nowrap">
                            <div sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')" class="d-flex flex-wrap gap-1">
                                <button th:if="${pedido.status == 'RECEBIDO'}"
                                        type="button" class="btn btn-sm btn-outline-primary btn-transicao"
                                        th:attr="data-pedido-id=${pedido.id}" data-status-destino="EM_PREPARACAO">
                                    Iniciar preparo
                                </button>
                                <button th:if="${pedido.status == 'EM_PREPARACAO'}"
                                        type="button" class="btn btn-sm btn-outline-primary btn-transicao"
                                        th:attr="data-pedido-id=${pedido.id}" data-status-destino="PRONTO">
                                    Marcar pronto
                                </button>
                                <button th:if="${pedido.status == 'PRONTO'}"
                                        type="button" class="btn btn-sm btn-outline-primary btn-transicao"
                                        th:attr="data-pedido-id=${pedido.id}" data-status-destino="SAIU_PARA_ENTREGA">
                                    Saiu para entrega
                                </button>
                                <button th:if="${pedido.status == 'PRONTO'}"
                                        type="button" class="btn btn-sm btn-outline-primary btn-transicao"
                                        th:attr="data-pedido-id=${pedido.id}" data-status-destino="RETIRADO">
                                    Retirado
                                </button>
                                <button th:if="${pedido.status == 'SAIU_PARA_ENTREGA' or pedido.status == 'RETIRADO'}"
                                        type="button" class="btn btn-sm btn-outline-success btn-transicao"
                                        th:attr="data-pedido-id=${pedido.id}" data-status-destino="FINALIZADO">
                                    Finalizar
                                </button>
                            </div>
                            <div sec:authorize="hasRole('GERENTE')" class="d-flex flex-wrap gap-1 mt-1">
                                <button th:if="${pedido.status == 'RECEBIDO' or pedido.status == 'EM_PREPARACAO' or pedido.status == 'PRONTO'}"
                                        type="button" class="btn btn-sm btn-outline-warning btn-desconto"
                                        th:attr="data-pedido-id=${pedido.id}">
                                    Desconto
                                </button>
                                <button th:if="${pedido.status == 'RECEBIDO' or pedido.status == 'EM_PREPARACAO' or pedido.status == 'PRONTO'}"
                                        type="button" class="btn btn-sm btn-outline-danger btn-cancelar"
                                        th:attr="data-pedido-id=${pedido.id}">
                                    Cancelar
                                </button>
                            </div>
                            <div sec:authorize="hasAnyRole('GERENTE', 'ATENDENTE')">
                                <span th:if="${pedido.status == 'FINALIZADO' or pedido.status == 'CANCELADO'}"
                                      class="text-muted small">Sem ações</span>
                                <span th:if="${pedido.status != 'RECEBIDO' and pedido.status != 'EM_PREPARACAO'
                                              and pedido.status != 'PRONTO' and pedido.status != 'SAIU_PARA_ENTREGA'
                                              and pedido.status != 'RETIRADO' and pedido.status != 'FINALIZADO'
                                              and pedido.status != 'CANCELADO'}"
                                      class="text-danger small">Status inválido</span>
                            </div>
                            <span sec:authorize="!hasAnyRole('GERENTE', 'ATENDENTE')" class="text-muted small">
                                Somente leitura
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <script>
        const erroStatus = document.getElementById('erroStatus');

        function exibirErroStatus(mensagem) {
            erroStatus.textContent = mensagem;
            erroStatus.style.display = 'block';
        }

        document.querySelectorAll('.btn-transicao').forEach((botao) => {
            botao.addEventListener('click', async () => {
                erroStatus.style.display = 'none';
                const pedidoId = botao.dataset.pedidoId;
                const statusDestino = botao.dataset.statusDestino;
                const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
                const headers = {};
                if (csrfToken && csrfHeader) {
                    headers[csrfHeader] = csrfToken;
                }

                botao.disabled = true;
                try {
                    const response = await fetch(
                        `/api/pedidos/${encodeURIComponent(pedidoId)}/status?status=${encodeURIComponent(statusDestino)}`,
                        { method: 'PUT', headers }
                    );

                    if (response.ok) {
                        window.location.reload();
                        return;
                    }

                    let mensagem = 'Não foi possível atualizar o pedido.';
                    try {
                        const body = await response.json();
                        mensagem = body.detail || body.message || mensagem;
                    } catch {
                        // Mantém a mensagem padrão quando a resposta não é JSON.
                    }
                    exibirErroStatus(mensagem);
                } catch {
                    exibirErroStatus('Erro de rede ao atualizar o pedido.');
                } finally {
                    botao.disabled = false;
                }
            });
        });

        function csrfHeaders(extra = {}) {
            const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;
            const headers = { 'Content-Type': 'application/json', ...extra };
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }
            return headers;
        }

        document.querySelectorAll('.btn-desconto').forEach((botao) => {
            botao.addEventListener('click', async () => {
                erroStatus.style.display = 'none';
                const pedidoId = botao.dataset.pedidoId;
                const entrada = window.prompt('Desconto percentual (0,01 a 20):');
                if (entrada === null) return;
                const percentual = Number(String(entrada).replace(',', '.'));
                if (!Number.isFinite(percentual) || percentual < 0.01 || percentual > 20) {
                    exibirErroStatus('Desconto deve ser entre 0,01% e 20%.');
                    return;
                }
                botao.disabled = true;
                try {
                    const response = await fetch(`/api/pedidos/${encodeURIComponent(pedidoId)}/desconto`,
                        { method: 'PUT', headers: csrfHeaders(), body: JSON.stringify({ percentual }) });
                    if (response.ok) {
                        window.location.reload();
                        return;
                    }
                    exibirErroStatus('Não foi possível aplicar o desconto.');
                } catch {
                    exibirErroStatus('Erro de rede ao aplicar desconto.');
                } finally {
                    botao.disabled = false;
                }
            });
        });

        document.querySelectorAll('.btn-cancelar').forEach((botao) => {
            botao.addEventListener('click', async () => {
                erroStatus.style.display = 'none';
                const pedidoId = botao.dataset.pedidoId;
                const justificativa = window.prompt('Justificativa do cancelamento:');
                if (justificativa === null) return;
                if (!justificativa.trim()) {
                    exibirErroStatus('Justificativa obrigatória para cancelamento.');
                    return;
                }
                botao.disabled = true;
                try {
                    const response = await fetch(`/api/pedidos/${encodeURIComponent(pedidoId)}/cancelar`,
                        { method: 'PUT', headers: csrfHeaders(), body: JSON.stringify({ justificativa }) });
                    if (response.ok) {
                        window.location.reload();
                        return;
                    }
                    exibirErroStatus('Não foi possível cancelar o pedido.');
                } catch {
                    exibirErroStatus('Erro de rede ao cancelar pedido.');
                } finally {
                    botao.disabled = false;
                }
            });
        });
    </script>

</div>

</body>
</html>
